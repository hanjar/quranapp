name = "mushaf-api"
main = "src/index.ts"
compatibility_date = "2026-10-01"
compatibility_flags = ["nodejs_compat"]

# Same-origin deployment: /api/* of the Pages custom domain is routed to this Worker
# (see docs/worker.md).
routes = [{ pattern = "quran.hanjar.net/api/*", zone_name = "hanjar.net" }]

[vars]
APP_ORIGIN = "https://quran.hanjar.net"
DEV_AUTH = "0"

[[d1_databases]]
binding = "DB"
database_name = "mushaf"
database_id = "eecf4f5e-7a0a-4e7c-8e27-34200416e4e2"
migrations_dir = "migrations"

[triggers]
crons = ["17 3 * * *"] # daily cleanup (UTC)
